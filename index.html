<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>厨神潜质测试｜厨房人格研究所</title>
<style>
:root {
  --bg:#fff8f0;--paper:#fffefa;--ink:#30251f;
  --muted:#88786c;--orange:#e97845;--line:#efdfd0;
  --shadow:0 20px 60px rgba(91,55,28,.09);
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--ink);
 font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
 background:radial-gradient(circle at 7% 5%,#ffe5d2,transparent 26%),
 radial-gradient(circle at 95% 15%,#fff0c8,transparent 25%),var(--bg)
}
button{font:inherit}
.wrap{max-width:1000px;margin:auto;padding:24px 20px 45px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.brand{font-weight:900;color:var(--ink)}.brand b{color:var(--orange)}
.tag{background:white;border:1px solid var(--line);padding:8px 13px;border-radius:99px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:25px;padding:45px 5px 30px}
.eyebrow{display:inline-block;background:white;border:1px solid var(--line);border-radius:99px;padding:8px 13px;color:#cf6236;font-size:12px;font-weight:800}
h1{font-size:clamp(38px,6vw,64px);line-height:1.1;letter-spacing:-.05em;margin:18px 0}
h1 em{font-style:normal;color:var(--orange)}
.hero p{color:var(--muted);font-size:15px;line-height:1.9}
.art{height:260px;display:grid;place-items:center;position:relative}
.plate{width:215px;height:215px;border-radius:50%;background:white;border:11px solid #f0e3d4;box-shadow:var(--shadow);display:grid;place-items:center;font-size:100px;transform:rotate(-8deg)}
.float{position:absolute;background:white;border:1px solid var(--line);border-radius:15px;padding:10px 13px;box-shadow:0 8px 24px #73451b12;font-size:13px;font-weight:800}
.f1{top:15px;right:0}.f2{bottom:15px;left:0}.f3{right:0;bottom:70px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);overflow:hidden}
.quiz-head{display:flex;justify-content:space-between;align-items:center;padding:21px 26px;border-bottom:1px solid #f3e8de}
.quiz-head h2{font-size:18px;margin:0}
.step{font-size:13px;color:var(--muted)}
.progress{height:7px;background:#f5e9df;margin:0 26px;border-radius:99px;overflow:hidden}
.progress-in{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffc36d);transition:width .25s}
.quiz-body{padding:28px 26px}
.kicker{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--orange);margin-bottom:10px}
.question{font-size:clamp(22px,3.3vw,30px);line-height:1.45;margin:0 0 10px}
.desc{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:22px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{display:flex;gap:12px;text-align:left;min-height:80px;padding:15px;background:white;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;color:var(--ink);transition:.16s}
.option:hover{border-color:#eda47d;transform:translateY(-2px)}
.option.selected{border-color:var(--orange);background:#fff2e9;box-shadow:0 0 0 2px #e9784515}
.opt-icon{font-size:24px;flex:0 0 29px}
.opt-text strong{display:block;font-size:14px;margin-bottom:5px}
.opt-text small{display:block;font-size:12px;line-height:1.5;color:var(--muted)}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:25px}
.back{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:12px 0}
.back:disabled{opacity:.25}
.primary{border:0;border-radius:99px;padding:13px 24px;background:var(--orange);color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 18px #e9784530}
.primary:disabled{background:#e4d7cb;box-shadow:none;cursor:not-allowed}
.note{text-align:center;color:#a39488;font-size:12px;margin-top:16px;line-height:1.7}
.result{display:none;text-align:center;padding:32px 25px}
.result.show{display:block}.quiz.hide{display:none}
.result-badge{display:inline-block;background:#fff0e3;color:#cb6338;border-radius:99px;padding:8px 13px;font-size:12px;font-weight:800}
.result-emoji{font-size:85px;margin:16px 0 5px}
.result h2{font-size:clamp(29px,5vw,42px);margin:5px 0}
.result-sub{color:#d66b3d;font-weight:800}
.result-desc{max-width:680px;margin:auto;color:#77685d;line-height:1.9;font-size:15px}
.traits{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:21px 0}
.trait{background:white;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;color:#76675a}
.scores{max-width:680px;margin:27px auto;text-align:left;background:white;border:1px solid var(--line);border-radius:18px;padding:20px}
.scores h3{font-size:16px}
.score-row{display:grid;grid-template-columns:95px 1fr 42px;gap:10px;align-items:center;margin:14px 0;font-size:13px}
.bar{height:10px;background:#f3e8de;border-radius:99px;overflow:hidden}
.bar-in{height:100%;background:linear-gradient(90deg,var(--orange),#ffc36d)}
.tip{max-width:680px;margin:0 auto 23px;text-align:left;background:#fff5e9;border:1px solid #f1dfca;border-radius:17px;padding:16px;line-height:1.9;font-size:14px}
.tip strong{color:#cb6338}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.secondary{border:1px solid var(--line);background:white;border-radius:99px;padding:12px 20px;font-weight:800;cursor:pointer}
.footer{text-align:center;color:#a39488;font-size:12px;padding-top:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#30251f;color:white;border-radius:99px;padding:11px 17px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
 .wrap{padding:17px 13px 35px}
 .hero{grid-template-columns:1fr;padding:28px 2px 22px;gap:0}
 .art{height:180px;order:-1}
 .plate{width:155px;height:155px;font-size:73px;border-width:8px}
 .float{font-size:11px;padding:8px}
 h1{margin-top:14px}
 .hero p{font-size:14px}
 .quiz-head{padding:18px 16px}
 .progress{margin:0 16px}
 .quiz-body{padding:22px 16px}
 .options{grid-template-columns:1fr;gap:9px}
 .option{min-height:68px;padding:13px}
 .result{padding:24px 15px}
 .score-row{grid-template-columns:80px 1fr 35px;gap:7px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
 <div class="brand">🍳 <b>厨房人格研究所</b> / FUN TEST</div>
 <div class="tag">轻松测一测 · 约4分钟</div>
</div>

<header class="hero">
 <div>
  <div class="eyebrow">✨ 16种厨房人格 · 不会做饭也能测</div>
  <h1>你的厨房隐藏身份<br>到底是<em>什么？</em></h1>
  <p>这不是厨艺考试，也不是做饭爱好调查。我们会先了解你与厨房的距离，再观察你的调味判断、火候意识、创意搭配、效率和应变方式。没做过、不适用的题目可以跳过；完全不想做饭，也有属于你的结果。</p>
 </div>
 <div class="art">
  <div class="plate">🍳</div>
  <div class="float f1">🧂 调味有直觉？</div>
  <div class="float f2">🌱 潜力待解锁</div>
  <div class="float f3">😋 美食也很棒</div>
 </div>
</header>

<section class="card" id="quizCard">
 <div class="quiz" id="quiz">
  <div class="quiz-head">
   <h2>厨神潜质测试</h2>
   <div class="step" id="step"></div>
  </div>
  <div class="progress"><div class="progress-in" id="progress"></div></div>
  <div class="quiz-body">
   <div class="kicker" id="kicker"></div>
   <h3 class="question" id="question"></h3>
   <p class="desc" id="desc"></p>
   <div class="options" id="options"></div>
   <div class="controls">
    <button class="back" id="back" disabled>← 上一题</button>
    <button class="primary" id="next" disabled>选好了，下一题 →</button>
   </div>
   <p class="note">没有标准答案。“没经验 / 不适用”会跳过本题，不计入能力分。</p>
  </div>
 </div>
 <div class="result" id="result"></div>
</section>
<div class="footer">本测试仅供娱乐 · 不会做饭不是缺点，喜欢吃也是一种生活智慧 😋</div>
</div>
<div class="toast" id="toast">结果已复制</div>

const questions=[...profileQuestions];
dimensions.forEach(d=>d.qs.forEach(q=>questions.push({
type:"ability",dim:d.id,dimName:d.name,q:q[0],
desc:"选择最接近你真实反应的一项。没有相关经验也没关系，可以选择最后一项跳过。",
a:[
[d.icon,q[1][0],"判断细致，愿意主动调整",3],
["🌟",q[1][1],"有一定方法，倾向稳妥处理",2],
["🧭",q[1][2],"更依赖步骤或简单经验",1],
["💭",q[1][3],"目前较少实践，或更倾向省事",0],
["🌱","我没做过 / 不了解 / 不适用","跳过本题，不会扣分","na"]
]})));

let current=0;
let answers=Array(questions.length).fill(null);
const $=id=>document.getElementById(id);

function render(){
 const q=questions[current];
 $("step").textContent=`第 ${current+1} / ${questions.length} 题`;
 $("kicker").textContent=q.type==="profile"?"FIRST, GET TO KNOW YOU":`${q.dimName.toUpperCase()} · ${String(current-profileQuestions.length).padStart(2,"0")}`;
 $("question").textContent=q.q;
 $("desc").textContent=q.desc||"";
 $("progress").style.width=`${(current+1)/questions.length*100}%`;
 $("back").disabled=current===0;
 $("next").disabled=answers[current]===null;
 $("next").textContent=current===questions.length-1?"揭晓我的厨房身份 ✨":"选好了，下一题 →";

 $("options").innerHTML=q.a.map((a,i)=>`
 <button class="option ${answers[current]?.index===i?"selected":""}" data-i="${i}">
 <span class="opt-icon">${a[0]}</span>
 <span class="opt-text"><strong>${a[1]}</strong><small>${a[2]}</small></span>
 </button>`).join("");

 $("options").querySelectorAll(".option").forEach(btn=>{
  btn.addEventListener("click",()=>{
   const i=Number(btn.dataset.i);
   answers[current]={index:i,value:q.a[i][3]};
   render();
  });
 });
}

function determine(scores,coverage){
  const interest=answers[1]?.value||"neutral";
  const motive=answers[2]?.value||"practical";
  const experience=answers[0]?.value||"none";

  const count=Object.values(coverage).reduce((a,b)=>a+b,0);
  const total=Object.values(scores).reduce((a,b)=>a+b,0);
  const norm=total/Math.max(1,count*3);

  // 完全不感兴趣或只喜欢享受美食
  if(interest==="none"||interest==="foodie") return "foodie";

  // 有效回答太少，不随意给能力贴标签
  if(count<8){
    return (interest==="curious"||interest==="high") ? "curious" : "potential";
  }

  // 综合能力突出
  if(norm>=0.80) return "chef";

  // 兴趣偏好与能力表现结合
  if(motive==="experiment"&&norm>=0.48) return "experiment";
  if(motive==="creative"&&norm>=0.48) return "creative";

  const ranked=Object.keys(scores).sort((a,b)=>
    scores[b]/Math.max(1,coverage[b])-scores[a]/Math.max(1,coverage[a])
  );
  const first=ranked[0];
  const firstScore=scores[first]/Math.max(1,coverage[first]);
  const secondScore=scores[ranked[1]]/Math.max(1,coverage[ranked[1]]);

  // 多维度表现接近，判定为均衡型
  if(norm>=0.55&&Math.abs(firstScore-secondScore)<=0.35) return "balanced";

  // 突出能力类型
  if(norm>=0.45){
    if(first==="heat") return "heat";
    if(first==="seasoning") return "seasoning";
    if(first==="creativity") return "creative";
    if(first==="efficiency") return "speed";
    if(first==="adaptability") return "rescue";
  }

  // 中等表现时进一步区分做事风格
  if(first==="efficiency"&&norm>=0.35) return "planner";
  if((first==="heat"||first==="seasoning")&&norm>=0.35) return "careful";

  if(interest==="curious"||interest==="high") return "learner";
  if(experience==="regular"||experience==="advanced") return "home";
  if(motive==="care") return "home";
  if(norm>=0.35) return "balanced";
  return "minimalist";
}

function showResult(){
 const scores={},coverage={};
 dimensions.forEach(d=>{scores[d.id]=0;coverage[d.id]=0});

 questions.forEach((q,i)=>{
  if(q.type!=="ability"||!answers[i])return;
  const value=q.a[answers[i].index][3];
  if(value==="na")return;
  scores[q.dim]+=value;
  coverage[q.dim]++;
 });

 const count=Object.values(coverage).reduce((a,b)=>a+b,0);
 const key=determine(scores,coverage);
 const r=profiles[key];

 const bars=dimensions.map(d=>{
  const pct=coverage[d.id]?Math.round(scores[d.id]/(coverage[d.id]*3)*100):null;
  return `<div class="score-row"><span>${d.name}</span>
  <div class="bar"><div class="bar-in" style="width:${pct??0}%"></div></div>
  <b>${pct===null?"—":pct+"%"}</b></div>`;
 }).join("");

 const note=count<12
 ?"你跳过了较多能力题，因此图表只展示已回答题目的表现；这不是低分。"
 :`本次有 ${count} 道能力题计入分析；没经验或不适用的题目已跳过。`;

 $("quiz").classList.add("hide");
 $("result").classList.add("show");
 $("progress").style.width="100%";

 $("result").innerHTML=`
 <div class="result-badge">🍴 你的结果已出炉 · 个性化分析</div>
 <div class="result-emoji">${r[0]}</div>
 <h2>你是「${r[1]}」</h2>
 <p class="result-sub">${r[2]}</p>
 <p class="result-desc">${r[3]}</p>
 <div class="traits">${r[4].map(t=>`<span class="trait">${t}</span>`).join("")}</div>
 <div class="scores"><h3>五大维度参考图</h3>${bars}
 <p class="note" style="text-align:left">${note}</p></div>
 <div class="tip"><strong>给你的专属建议：</strong>${r[5]}</div>
 <div class="actions">
 <button class="primary" id="restart">再测一次 ↻</button>
 <button class="secondary" id="share">复制我的测试结果</button>
 </div>`;

 $("restart").addEventListener("click",restart);
 $("share").addEventListener("click",()=>share(r,count));
}

function restart(){
 current=0;
 answers=Array(questions.length).fill(null);
 $("quiz").classList.remove("hide");
 $("result").classList.remove("show");
 render();
 $("quizCard").scrollIntoView({behavior:"smooth",block:"start"});
}

async function share(r,count){
 const content=`我的厨房隐藏身份：${r[0]} ${r[1]}
${r[2]}
有效回答能力题：${count} 道。来测测你的厨房隐藏身份！`;
 try{
  await navigator.clipboard.writeText(content);
 }catch(e){
  const ta=document.createElement("textarea");
  ta.value=content;document.body.appendChild(ta);
  ta.select();document.execCommand("copy");ta.remove();
 }
 $("toast").textContent="结果已复制，快去分享吧！";
 $("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),2200);
}

$("back").addEventListener("click",()=>{
 if(current>0){current--;render()}
});
$("next").addEventListener("click",()=>{
 if(answers[current]===null)return;
 if(current<questions.length-1){current++;render()}
 else showResult();
});
render();
</script>
